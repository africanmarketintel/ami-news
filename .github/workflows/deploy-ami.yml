# ═══════════════════════════════════════════════════════════════
# AMI — GitHub Actions deployment workflow
# Place this file at: .github/workflows/deploy.yml in your repo
#
# What it does:
#   1. Triggered on every push to main branch
#   2. Injects your Supabase secrets into config.js
#   3. Deploys the site to GitHub Pages
# ═══════════════════════════════════════════════════════════════

name: Deploy AMI Site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Inject Supabase secrets into config.js ──────────────────
      # Replaces placeholder text with real values from GitHub secrets.
      # Never hard-code real credentials in config.js.
      - name: Inject Supabase secrets
        run: |
          sed -i "s|SUPABASE_URL_PLACEHOLDER|${{ secrets.SUPABASE_URL }}|g" ami-news-pages/config.js
          sed -i "s|SUPABASE_ANON_PLACEHOLDER|${{ secrets.SUPABASE_ANON }}|g" ami-news-pages/config.js

      # ── Deploy to GitHub Pages ───────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ami-news-pages   # ← change this if your HTML files are in a different folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
