name: Generate OG Article Pages
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: generate-og-pages
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate OG pages
        run: node scripts/generate-og-pages.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/*.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: regenerate article OG pages"
          git pull --rebase origin main
          git push origin main
