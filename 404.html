<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    var path = window.location.pathname;
    var match = path.match(/^\/articles\/(.+)\.html$/);
    if (match) {
      window.location.replace('/article.html?slug=' + encodeURIComponent(match[1]));
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body></body>
</html>
