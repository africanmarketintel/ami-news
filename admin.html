<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABTA Deal Room — Admin</title>
<meta name="robots" content="noindex, nofollow">
<script src="config.js"></script>
<script src="login.js"></script>
<style>
  :root{--gold:#C9A84C;--ink:#1A1208;--ink-soft:#6B5344;--cream:#FAF7F0;--border:#D4C4A0;--green:#1E6B3C;--terra:#B85C38}
  *{box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--ink);margin:0;padding:0}
  header{background:#0A1A10;color:#EDE5D5;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold)}
  header h1{font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0}
  .wrap{max-width:1100px;margin:0 auto;padding:24px}
  .gate{max-width:360px;margin:80px auto;background:#fff;border:1px solid var(--border);border-radius:4px;padding:28px}
  .gate input{width:100%;padding:10px 12px;margin-bottom:10px;border:1px solid var(--border);border-radius:3px;font-size:14px}
  .gate button{width:100%;padding:10px;background:var(--gold);border:none;border-radius:3px;font-weight:600;cursor:pointer}
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border)}
  .tab{padding:10px 16px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink-soft)}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold)}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);background:#F0EAD9}
  .pill{display:inline-block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:2px}
  .pill-active{background:rgba(30,107,60,.12);color:var(--green)}
  .pill-revoked,.pill-rejected{background:rgba(184,92,56,.12);color:var(--terra)}
  .pill-pending{background:rgba(201,168,76,.15);color:#8A6A1A}
  button.act{font-size:11px;padding:6px 12px;border:1px solid var(--border);border-radius:3px;background:#fff;cursor:pointer;margin-right:4px}
  button.act.primary{background:var(--gold);border-color:var(--gold)}
  button.act.danger{color:var(--terra);border-color:var(--terra)}
  .empty{padding:40px;text-align:center;color:var(--ink-soft)}
  .msg{padding:10px 14px;border-radius:3px;font-size:13px;margin-bottom:14px;display:none}
  .msg.err{background:rgba(184,92,56,.1);color:var(--terra);display:block}
  .msg.ok{background:rgba(30,107,60,.1);color:var(--green);display:block}
</style>
</head>
<body>

<header>
  <h1>ABTA Deal Room — Admin</h1>
  <span id="whoami" style="font-size:11px;color:#A89070"></span>
</header>

<div id="gateWrap" class="gate">
  <p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px">Sign in with your AMI account. Access requires a row in <code>admin_users</code> — see docs/deal-room-phase2-qa-admin-schema.sql.</p>
  <input type="email" id="adminEmail" placeholder="you@abta.africa">
  <input type="password" id="adminPassword" placeholder="Password">
  <button onclick="adminSignIn()">Sign in</button>
  <div id="gateError" class="msg err" style="display:none"></div>
</div>

<div class="wrap" id="appWrap" style="display:none">
  <div id="banner" class="msg"></div>
  <div class="tabs">
    <div class="tab active" data-tab="deals" onclick="switchTab('deals')">Pending Deals</div>
    <div class="tab" data-tab="questions" onclick="switchTab('questions')">Open Questions</div>
    <div class="tab" data-tab="members" onclick="switchTab('members')">Members</div>
    <div class="tab" data-tab="audit" onclick="switchTab('audit')">Audit Log</div>
  </div>
  <div id="panel"></div>
</div>

<script>
function sbUrl(){ return SUPABASE_URL.replace(/\/$/,''); }

async function adminSignIn(){
  const email = document.getElementById('adminEmail').value;
  const password = document.getElementById('adminPassword').value;
  const errEl = document.getElementById('gateError');
  errEl.style.display = 'none';
  try{
    const r = await fetch(sbUrl()+'/auth/v1/token?grant_type=password', {
      method:'POST', headers:{ 'Content-Type':'application/json', apikey: SUPABASE_ANON },
      body: JSON.stringify({ email, password })
    });
    const data = await r.json();
    if(!r.ok){ errEl.textContent = data.error_description || 'Sign in failed.'; errEl.style.display='block'; return; }
    localStorage.setItem('ami_auth_token', data.access_token);
    localStorage.setItem('ami_user_email', email);
    await boot();
  }catch(err){ errEl.textContent = 'Network error.'; errEl.style.display='block'; }
}

async function adminFetch(path, opts){
  return functionFetch('deal-room-admin'+path, opts);
}

// Generic caller for any Edge Function, reusing the same auth header.
// Used for the AI-assist functions (deal-room-screening-assist,
// deal-room-doc-summary, deal-room-qa's draft_answer action), which
// are separate functions from deal-room-admin rather than routes
// under it.
async function functionFetch(nameAndQuery, opts){
  const token = localStorage.getItem('ami_auth_token') || '';
  const res = await fetch(sbUrl()+'/functions/v1/'+nameAndQuery, {
    ...opts,
    headers: { 'Content-Type':'application/json', apikey: SUPABASE_ANON, 'Authorization':'Bearer '+token, ...(opts && opts.headers) }
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function banner(msg, ok){
  const b = document.getElementById('banner');
  b.textContent = msg; b.className = 'msg ' + (ok ? 'ok' : 'err');
  setTimeout(()=>{ b.style.display='none'; }, 4000);
}

async function boot(){
  const token = localStorage.getItem('ami_auth_token') || '';
  if(!token){ return; }
  try{
    await adminFetch('?action=members'); // also doubles as an admin-access check
    document.getElementById('gateWrap').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    document.getElementById('whoami').textContent = localStorage.getItem('ami_user_email') || '';
    switchTab('deals');
  }catch(err){
    document.getElementById('gateError').textContent = 'Signed in, but this account is not in admin_users.';
    document.getElementById('gateError').style.display = 'block';
  }
}

let currentTab = 'deals';
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  if(tab==='deals') renderDeals();
  if(tab==='questions') renderQuestions();
  if(tab==='members') renderMembers();
  if(tab==='audit') renderAudit();
}

let dealsCache = [];
async function renderDeals(){
  const panel = document.getElementById('panel');
  panel.innerHTML = 'Loading…';
  try{
    const { deals } = await adminFetch('?action=pending_deals');
    dealsCache = deals;
    if(!deals.length){ panel.innerHTML = '<div class="empty">No deals awaiting review.</div>'; return; }
    panel.innerHTML = '<table><thead><tr><th>Submitted</th><th>Type</th><th>Sector / Region</th><th>Summary</th><th>Submitter</th><th>Documents</th><th>AI</th><th>Action</th></tr></thead><tbody>' +
      deals.map(d => `<tr id="deal-row-${d.id}">
        <td>${new Date(d.created_at).toLocaleDateString('en-GB')}</td>
        <td>${d.deal_type||''}</td>
        <td>${d.sector||''}<br>${d.region||''}</td>
        <td style="max-width:280px">${(d.summary||'').slice(0,220)}</td>
        <td>${d.organisation||''}<br>${d.contact_name||''}<br>${d.contact_email||''}</td>
        <td>${(d.document_paths||[]).map(p=>`<div style="margin-bottom:4px">${p.split('/').pop()} <button class="act" style="padding:2px 8px;font-size:10px" onclick="summariseDoc('${d.id}','${p.replace(/'/g,"\\'")}')">Summarise</button></div>`).join('') || 'None'}
          <div id="doc-summary-${d.id}" style="font-size:11px;color:var(--ink-soft);margin-top:4px"></div>
        </td>
        <td style="max-width:180px">
          ${d.spam_flag ? `<div class="pill pill-rejected" style="margin-bottom:6px">Possible spam</div><div style="font-size:11px;color:var(--ink-soft);margin-bottom:6px">${d.spam_reason||''}</div>` : ''}
          <button class="act" onclick="screenDeal('${d.id}')">Get AI read</button>
          <div id="screen-notes-${d.id}" style="font-size:11px;color:var(--ink-soft);margin-top:6px">${d.ai_screening_notes ? formatScreeningNotes(d.ai_screening_notes) : ''}</div>
        </td>
        <td>
          <button class="act primary" onclick="approveDeal('${d.id}')">Approve →</button>
          <button class="act danger" onclick="rejectDeal('${d.id}')">Reject</button>
        </td>
      </tr>`).join('') + '</tbody></table>';
  }catch(err){ panel.innerHTML = '<div class="empty">Could not load pending deals.</div>'; }
}

function formatScreeningNotes(n){
  if(!n) return '';
  const flags = Array.isArray(n.flags) && n.flags.length ? '<br>Flags: ' + n.flags.join('; ') : '';
  return `<strong>Suitability:</strong> ${n.suitability||''}<br><strong>Credibility:</strong> ${n.credibility||''}<br><strong>Fit:</strong> ${n.fit||''}${flags}<br><strong>Read:</strong> ${n.summary||''}`;
}

async function screenDeal(id){
  const el = document.getElementById('screen-notes-'+id);
  el.textContent = 'Thinking…';
  try{
    const { notes } = await functionFetch('deal-room-screening-assist', { method:'POST', body: JSON.stringify({ deal_id: id }) });
    el.innerHTML = formatScreeningNotes(notes);
  }catch(err){ el.textContent = 'Could not generate a read right now.'; }
}

async function summariseDoc(dealId, path){
  const el = document.getElementById('doc-summary-'+dealId);
  el.textContent = 'Summarising…';
  try{
    const { summary, error } = await functionFetch('deal-room-doc-summary', { method:'POST', body: JSON.stringify({ document_path: path }) }).then(d=>({summary:d.summary,error:d.error})).catch(e=>({summary:null,error:e.message}));
    el.textContent = summary || (error==='unsupported_file_type' ? 'Only PDF and plain text can be summarised so far.' : 'Could not summarise this file.');
  }catch(err){ el.textContent = 'Could not summarise this file.'; }
}

async function renderQuestions(){
  const panel = document.getElementById('panel');
  panel.innerHTML = 'Loading…';
  try{
    const { questions } = await adminFetch('?action=open_questions');
    if(!questions.length){ panel.innerHTML = '<div class="empty">No open questions.</div>'; return; }
    panel.innerHTML = '<table><thead><tr><th>Asked</th><th>Teaser</th><th>From</th><th>Question</th><th>Answer</th></tr></thead><tbody>' +
      questions.map(q => `<tr id="q-row-${q.id}">
        <td>${new Date(q.created_at).toLocaleDateString('en-GB')}</td>
        <td>${q.teaser_ref}</td>
        <td>${q.asked_by_email}</td>
        <td style="max-width:260px">${q.question}</td>
        <td style="min-width:280px">
          <textarea id="answer-${q.id}" rows="3" style="width:100%;font-size:12px;padding:6px;border:1px solid var(--border);border-radius:3px"></textarea>
          <div style="margin-top:4px">
            <button class="act" onclick="draftAnswer('${q.id}')">Draft with AI</button>
            <button class="act primary" onclick="sendAnswer('${q.id}')">Send</button>
          </div>
        </td>
      </tr>`).join('') + '</tbody></table>';
  }catch(err){ panel.innerHTML = '<div class="empty">Could not load open questions.</div>'; }
}

async function draftAnswer(id){
  const ta = document.getElementById('answer-'+id);
  ta.value = 'Drafting…';
  try{
    const { draft } = await functionFetch('deal-room-qa', { method:'POST', body: JSON.stringify({ action:'draft_answer', question_id: id }) });
    ta.value = draft || '';
  }catch(err){ ta.value = ''; banner('Could not draft an answer right now.', false); }
}

async function sendAnswer(id){
  const ta = document.getElementById('answer-'+id);
  const answer = ta.value.trim();
  if(!answer) return;
  try{
    await functionFetch('deal-room-qa', { method:'POST', body: JSON.stringify({ action:'answer', question_id: id, answer }) });
    banner('Answer sent.', true);
    renderQuestions();
  }catch(err){ banner(err.message, false); }
}

async function approveDeal(id){
  const published_ref = prompt('Published reference (e.g. ABTA-2026-004):');
  if(!published_ref) return;
  const teaser_headline = prompt('Teaser headline (optional):') || '';
  try{
    await adminFetch('', { method:'POST', body: JSON.stringify({ action:'approve_deal', id, published_ref, teaser_headline, counterparty_data: [] }) });
    banner('Deal approved and published. Add counterparty_data via Table Editor if not entered here.', true);
    renderDeals();
  }catch(err){ banner(err.message, false); }
}
async function rejectDeal(id){
  if(!confirm('Reject this submission?')) return;
  try{ await adminFetch('', { method:'POST', body: JSON.stringify({ action:'reject_deal', id }) }); banner('Deal rejected.', true); renderDeals(); }
  catch(err){ banner(err.message, false); }
}

async function renderMembers(){
  const panel = document.getElementById('panel');
  panel.innerHTML = 'Loading…';
  try{
    const { members } = await adminFetch('?action=members');
    panel.innerHTML = '<table><thead><tr><th>Joined</th><th>Name / Org</th><th>Email</th><th>Status</th><th>Action</th></tr></thead><tbody>' +
      members.map(m => `<tr>
        <td>${new Date(m.created_at).toLocaleDateString('en-GB')}</td>
        <td>${m.full_name||''}<br>${m.organisation||''}</td>
        <td>${m.email}</td>
        <td><span class="pill pill-${m.status}">${m.status}</span></td>
        <td>${m.status==='active'
          ? `<button class="act danger" onclick="revokeMember('${m.id}')">Revoke</button>`
          : `<button class="act primary" onclick="reinstateMember('${m.id}')">Reinstate</button>`}</td>
      </tr>`).join('') + '</tbody></table>';
  }catch(err){ panel.innerHTML = '<div class="empty">Could not load members.</div>'; }
}
async function revokeMember(id){
  if(!confirm('Revoke this member\'s Deal Room access?')) return;
  try{ await adminFetch('', { method:'POST', body: JSON.stringify({ action:'revoke_member', id }) }); banner('Access revoked.', true); renderMembers(); }
  catch(err){ banner(err.message, false); }
}
async function reinstateMember(id){
  try{ await adminFetch('', { method:'POST', body: JSON.stringify({ action:'reinstate_member', id }) }); banner('Access reinstated.', true); renderMembers(); }
  catch(err){ banner(err.message, false); }
}

async function renderAudit(){
  const panel = document.getElementById('panel');
  panel.innerHTML = 'Loading…';
  try{
    const { log } = await adminFetch('?action=audit');
    panel.innerHTML = '<table><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Teaser</th><th>Detail</th></tr></thead><tbody>' +
      log.map(l => `<tr>
        <td>${new Date(l.created_at).toLocaleString('en-GB')}</td>
        <td>${l.actor_email||''}</td>
        <td>${l.action}</td>
        <td>${l.teaser_ref||''}</td>
        <td><code style="font-size:11px">${l.detail?JSON.stringify(l.detail):''}</code></td>
      </tr>`).join('') + '</tbody></table>';
  }catch(err){ panel.innerHTML = '<div class="empty">Could not load the audit log.</div>'; }
}

boot();
</script>
</body>
</html>
