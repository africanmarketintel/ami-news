<script>
  // The Deal Room moved from /deal-room/ to /dealroom/ on 14 October 2026.
  //
  // GitHub Pages serves static files and has no redirect configuration, so a
  // real 301 is not available. This page is the substitute: anything already
  // indexed, bookmarked or sent in an email still arrives at the right place.
  //
  // The canonical link above is what tells search engines which URL is the
  // real one, since a client-side redirect alone does not pass that on.
  (function () {
    var p = new URLSearchParams(location.search);
    var join = (p.get('join') === '1' || location.hash === '#join');
    location.replace('dealroom/' + (join ? 'create-account.html' : 'index.html'));
  })();
</script>
