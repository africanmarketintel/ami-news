<!DOCTYPE html>
<html>
<head>
<title>AMI Supabase Diagnostic</title>
<script src="config.js"></script>
<style>
  body { font-family: monospace; padding: 24px; background: #1a1a1a; color: #eee; }
  h1 { color: #C9A84C; }
  .test { margin: 12px 0; padding: 12px; border-radius: 4px; }
  .ok   { background: #1a3a1a; border-left: 4px solid #4CAF50; }
  .err  { background: #3a1a1a; border-left: 4px solid #f44336; }
  .info { background: #1a1a3a; border-left: 4px solid #2196F3; }
  pre { margin: 4px 0; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>AMI Supabase Diagnostic</h1>
<div id="out"></div>

<script>
const out = document.getElementById('out');
function log(cls, title, detail) {
  out.innerHTML += `<div class="test ${cls}"><b>${title}</b><pre>${detail||''}</pre></div>`;
}

async function run() {
  // 1. Check config
  log('info', '1. Config values',
    `SUPABASE_URL  = ${typeof SUPABASE_URL !== 'undefined' ? SUPABASE_URL : 'UNDEFINED'}\n` +
    `SUPABASE_ANON = ${typeof SUPABASE_ANON !== 'undefined' ? SUPABASE_ANON : 'UNDEFINED'}`);

  if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON === 'undefined') {
    log('err', 'config.js not loaded', 'Make sure config.js is in the same folder'); return;
  }

  // 2. Test basic connectivity (health check)
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/', {
      headers: { apikey: SUPABASE_ANON }
    });
    log(r.ok ? 'ok' : 'err', `2. REST endpoint: HTTP ${r.status}`, await r.text().then(t => t.slice(0,300)));
  } catch(e) {
    log('err', '2. REST endpoint: FAILED', e.message);
  }

  // 3. Test articles table
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/articles?select=id,headline&limit=3', {
      headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON }
    });
    const text = await r.text();
    log(r.ok ? 'ok' : 'err', `3. articles table: HTTP ${r.status}`, text.slice(0,500));
  } catch(e) {
    log('err', '3. articles table: FAILED', e.message);
  }

  // 4. Test markets table
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/markets?select=*&limit=3', {
      headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON }
    });
    const text = await r.text();
    log(r.ok ? 'ok' : 'err', `4. markets table: HTTP ${r.status}`, text.slice(0,500));
  } catch(e) {
    log('err', '4. markets table: FAILED', e.message);
  }

  // 5. Test site_settings table
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/site_settings?select=*&limit=3', {
      headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON }
    });
    const text = await r.text();
    log(r.ok ? 'ok' : 'err', `5. site_settings table: HTTP ${r.status}`, text.slice(0,500));
  } catch(e) {
    log('err', '5. site_settings table: FAILED', e.message);
  }

  // 6. Test WITHOUT Authorization header (apikey only)
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/articles?select=id&limit=1', {
      headers: { apikey: SUPABASE_ANON }
    });
    const text = await r.text();
    log(r.ok ? 'ok' : 'err', `6. articles (apikey only, no Bearer): HTTP ${r.status}`, text.slice(0,300));
  } catch(e) {
    log('err', '6. apikey-only test: FAILED', e.message);
  }
}

run();
</script>
</body>
</html>
